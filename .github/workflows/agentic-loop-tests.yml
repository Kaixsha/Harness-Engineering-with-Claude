name: Agentic Loop Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agentic-loop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agentic loop tests
        env:
          PYTHONPATH: ${{ github.workspace }}/agentic-loop
        run: python -m pytest -v

      - name: Run end-to-end claim demonstration
        env:
          PYTHONPATH: ${{ github.workspace }}/agentic-loop
        run: python -m src.run_claims

      - name: Display run artifact
        run: cat artifacts/run-001.json

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-loop-run-evidence
          path: agentic-loop/artifacts/run-001.json
